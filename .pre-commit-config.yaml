repos:
    -   repo: local
        hooks:
        -   id: fix-gdal-headers
            name: Fix GDAL Style Headers
            entry: python3 scripts/fix_gdal_block_headers.py
            language: python
            files: \.(h|cpp|hpp|c)$

        -   id: check-rst-files
            name: Check RST files for errors
            entry: python3 scripts/check_doc_rst_errors.py
            language: python
            files: \.rst$
            exclude: >
              (?x)^(
                  autotest/gdrivers/data/rst
              )

        -   id: detect-printf
            name: Check C/C++ files for printf statements
            entry: python3 scripts/detect_printf.py " printf"
            language: python
            files: \.(c|h|cpp|hpp)$
            exclude: >
              (?x)^(
                  alg/internal_libqhull/|
                  apps/|
                  autotest/|
                  ogr/generate_encoding|
                  ogr/ogrsf_frmts/dgn/dgndump.cpp|
                  ogr/ogrsf_frmts/ntf/ntfdump.cpp|
                  ogr/ogrsf_frmts/oci/fastload.cpp|
                  ogr/ogrsf_frmts/oci/ocitest.cpp|
                  ogr/ogrsf_frmts/ods/testparser.cpp|
                  ogr/ogrsf_frmts/osm/osm2osm.cpp|
                  ogr/ogrsf_frmts/s57/s57dump.cpp|
                  ogr/ogrsf_frmts/sqlite/test_load_virtual_ogr.c|
                  ogr/test_geo_utils|
                  frmts/aigrid/aitest.c|
                  frmts/ceos/ceostest.c|
                  frmts/envisat/dumpgeo.c|
                  frmts/envisat/envisat_dump.c|
                  frmts/grib/degrib|
                  frmts/gtiff/libtiff/|
                  frmts/hfa/hfatest|
                  frmts/iso8211/8211createfromxml.cpp|
                  frmts/iso8211/8211dump.cpp|
                  frmts/iso8211/8211view.cpp|
                  frmts/iso8211/timetest.cpp|
                  frmts/nitf/nitfdump.c|
                  frmts/png/libpng/|
                  frmts/zlib/|
                  perftests/|
                  third_party/
              )

        -   id: detect-fprintf
            name: Check C/C++ files for printf statements
            entry: python3 scripts/detect_printf.py "fprintf(stderr"
            language: python
            files: \.(cpp)$
            exclude: >
              (?x)^(
                  apps/|
                  autotest/|
                  frmts/grib/degrib|
                  frmts/iso8211/8211createfromxml.cpp|
                  frmts/iso8211/8211dump.cpp|
                  frmts/iso8211/8211view.cpp|
                  fuzzers/|
                  perftests/|
                  port/cpl_error.cpp|
                  port/cpl_multiproc.cpp|
                  port/vsipreload.cpp|
                  swig/|
                  third_party/
              )

        -   id: detect-missing-includes
            name: Check C++ files for missing includes
            entry: python3 scripts/detect_missing_includes.py
            language: python
            files: \.(h|cpp|hpp)$
            exclude: >
              (?x)^(
                  third_party/|
                  fuzzers/
              )

        -   id: detect-self-assignments
            name: Check for self-assignment statements
            entry: python3 scripts/detect_self_assignment.py
            language: python
            files: \.(h|cpp|hpp|c)$
            exclude: >
              (?x)^(
                  autotest/cpp
              )

        -   id: detect-tabs
            name: Detect tab characters
            entry: python3 scripts/detect_tabs.py
            language: python
            files: CMakeLists.txt|\.(h|hpp|cpp|py|cmake)$
            exclude: >
              (?x)^(
                  cmake/modules/thirdparty/|
                  frmts/gif/giflib/|
                  frmts/gtiff/libgeotiff/|
                  frmts/gtiff/libtiff/|
                  frmts/grib/degrib/|
                  frmts/hdf4/hdf-eos/|
                  frmts/jpeg/libjpeg/|
                  frmts/pcraster/libcsf/|
                  ogr/ogrsf_frmts/geojson/libjson/|
                  ogr/ogrsf_frmts/pmtiles/pmtiles/|
                  port/cpl_mem_cache.h
              )

    -   repo: https://github.com/sphinx-contrib/sphinx-lint
        rev: v1.0.2
        hooks:
          -   id: sphinx-lint
              args: [--disable=trailing-whitespace]
              exclude: >
                (?x)^(
                    autotest/gdrivers/data/rst
                )

    -   repo: https://github.com/psf/black
        rev: 26.1.0
        hooks:
        -   id: black
            exclude: >
              (?x)^(
                swig/python/setup.py.in|
                swig/python/osgeo/__init__.py|
                swig/python/osgeo/gdalnumeric.py|
                doc/source/_extensions/sphinxcontrib_programoutput_gdal.py|
                autotest/ogr/data/
              )
    -   repo: https://github.com/timothycrosley/isort
        rev: 7.0.0
        hooks:
        -   id: isort
            exclude: >
              (?x)^(
                swig/python/setup.py.in|
                swig/python/osgeo/__init__.py|
                swig/python/osgeo/gdalnumeric.py|
                doc/source/_extensions/sphinxcontrib_programoutput_gdal.py|
                autotest/ogr/data/
              )
    -   repo: https://github.com/pycqa/flake8
        rev: 7.3.0
        hooks:
        -   id: flake8
            exclude: >
              (?x)^(
                swig/python/setup.py.in|
                swig/python/osgeo/__init__.py|
                swig/python/osgeo/gdalnumeric.py|
                doc/source/_extensions/sphinxcontrib_programoutput_gdal.py|
                examples/|
                autotest/ogr/data/
              )
    -   repo: https://github.com/pre-commit/mirrors-clang-format
        rev: 'v21.1.8'
        hooks:
        -   id: clang-format
            exclude: >
              (?x)^(
                autotest/cpp/data/|
                autotest/gdrivers/data/|
                swig/|
                third_party/exprtk/|
                third_party/fast_float/|
                third_party/flatbuffers/|
                third_party/muparser/|
                third_party/LercLib/|
                third_party/libdivide/|
                autotest/ogr/data/|
                alg/internal_libqhull/|
                apps/argparse/|
                frmts/gtiff/libtiff/|
                frmts/gtiff/libgeotiff/|
                frmts/hdf4/hdf-eos/|
                frmts/jpeg/libjpeg/|
                frmts/jpeg/libjpeg12/|
                frmts/pcraster/libcsf/|
                frmts/png/libpng/|
                frmts/gif/giflib/|
                frmts/zarr/crc32c.h|
                frmts/zarr/crc32c.cpp|
                frmts/zlib/|
                frmts/pcidsk/sdk|
                frmts/grib/degrib/degrib|
                frmts/grib/degrib/g2clib|
                frmts/icechunk/generated|
                gcore/sse2neon.h|
                port/utf8.h|
                ogr/ogrsf_frmts/adbc/ogr_adbc_internal.h|
                ogr/ogrsf_frmts/cad/libopencad/|
                ogr/ogrsf_frmts/geojson/libjson/|
                ogr/ogrsf_frmts/pmtiles/pmtiles/|
                ogr/ogrsf_frmts/ods/ods_formula_parser.cpp|
                ogr/ogrsf_frmts/ods/ods_formula_parser.hpp|
                ogr/ogrsf_frmts/sqlite/sqlite_rtree_bulk_load|
                ogr/swq_parser.cpp|
                ogr/swq_parser.hpp|
                doc/source/
              )
